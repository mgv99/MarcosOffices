<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Marcos Offices</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/css/app.css" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%23171b26'/><rect x='3' y='5' width='10' height='8' fill='%23ffd866'/><rect x='5' y='7' width='2' height='2' fill='%23171b26'/><rect x='9' y='7' width='2' height='2' fill='%23171b26'/></svg>" />
</head>
<body>

<div class="app">
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark"></span>
      <span class="brand-name">MARCOS OFFICES</span>
    </div>

    <div class="topbar-actions">
      <button class="btn" data-panel="hq">
        HQ <span class="badge" id="badge-hq" hidden>0</span>
      </button>
      <button class="btn" data-panel="staff">Staff</button>
      <button class="btn" data-panel="departments">Departments</button>
      <button class="btn" data-panel="projects">Projects</button>
      <button class="btn" data-panel="components">Components</button>
      <button class="btn" data-panel="settings">Office</button>
    </div>

    <div class="topbar-right">
      <span class="conn" id="conn" title="Live connection"></span>
      <button class="auth-pill" id="auth-pill">checking…</button>
    </div>
  </header>

  <main class="main">
    <section class="map-area">
      <canvas id="office-canvas"></canvas>

      <div class="map-controls">
        <button class="btn btn-icon" id="btn-fit" title="Frame the whole office">⤢</button>
        <button class="btn btn-icon" id="btn-zoom-in" title="Zoom in">+</button>
        <button class="btn btn-icon" id="btn-zoom-out" title="Zoom out">−</button>
      </div>

      <div class="map-legend" id="map-legend"></div>
      <div class="map-hint">Drag to pan · scroll to zoom · click an agent to command them</div>
    </section>

    <aside class="side" id="side" data-open="false">
      <div class="side-head">
        <h2 id="side-title">—</h2>
        <button class="btn btn-icon" id="side-close" title="Close">✕</button>
      </div>
      <div class="side-body" id="side-body"></div>
    </aside>
  </main>
</div>

<div class="modal-backdrop" id="modal-backdrop" hidden>
  <div class="modal" id="modal">
    <div class="modal-head">
      <h3 id="modal-title">—</h3>
      <button class="btn btn-icon" id="modal-close">✕</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>

<div class="toasts" id="toasts"></div>

<script type="module" src="/js/app.js"></script>
</body>
</html>
